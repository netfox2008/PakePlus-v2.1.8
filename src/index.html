<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP视频解析-By haiyang457</title>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: #764ba2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .parse-box {
            padding: 25px;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        #videoUrl {
            flex: 1;
            min-width: 280px;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        #videoUrl:focus {
            border-color: #764ba2;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-primary {
            background: #667eea;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #999;
        }

        .btn-secondary:hover {
            background: #777;
        }

        .api-select {
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .video-player {
            width: 100%;
            height: 600px;
            border: none;
        }

        .tips {
            padding: 15px 25px;
            background: #f8f9fa;
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .video-player {
                height: 400px;
            }
            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1><i class="fas fa-play-circle"></i> VIP视频在线解析</h1>
            <p>支持腾讯/爱奇艺/优酷/芒果TV/哔哩哔哩等平台</p>
        </div>

        <!-- 解析输入框 -->
        <div class="parse-box">
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="请粘贴VIP视频播放页链接...">
                <select class="api-select" id="apiSelect">
                    <option value="https://jx.xmflv.cc/?url=">接口1</option>
                    <option value="https://yparse.ik9.cc/index.php?url=">接口2</option>
                    <option value="https://jx.playerjy.com/?ads=0&url=">接口3</option>
                </select>
                <button class="btn btn-primary" onclick="parseVideo()"><i class="fas fa-play"></i> 立即解析</button>
                <button class="btn btn-secondary" onclick="copyUrl()"><i class="fas fa-copy"></i> 复制链接</button>
                <button class="btn btn-secondary" onclick="clearInput()"><i class="fas fa-trash"></i> 清空</button>
            </div>
        </div>

        <!-- 播放区域 -->
        <iframe id="player" class="video-player" src="about:blank" frameborder="0" allowfullscreen></iframe>

        <!-- 使用提示 -->
        <div class="tips">
            <i class="fas fa-lightbulb"></i> 使用说明：<br>
            1. 打开VIP视频播放页，复制浏览器地址栏链接<br>
            2. 将链接粘贴到输入框，选择解析接口，点击立即解析即可观看<br>
            3. 部分接口可能失效，切换接口重试即可
             By haiyang457
        </div>
    </div>

    <script>
        // 解析视频
        function parseVideo() {
            let url = document.getElementById('videoUrl').value.trim();
            let api = document.getElementById('apiSelect').value;
            let player = document.getElementById('player');

            if (!url) {
                alert('请输入视频链接！');
                return;
            }
            
            // 拼接解析地址
            player.src = api + encodeURIComponent(url);
        }

        // 复制当前解析链接
        function copyUrl() {
            let url = document.getElementById('videoUrl').value.trim();
            if (!url) {
                alert('请先输入视频链接！');
                return;
            }
            
            navigator.clipboard.writeText(url).then(() => {
                alert('链接复制成功！');
            }).catch(err => {
                alert('复制失败，请手动复制！');
            });
        }

        // 清空输入框
        function clearInput() {
            document.getElementById('videoUrl').value = '';
            document.getElementById('player').src = 'about:blank';
        }
    </script>
</html>
